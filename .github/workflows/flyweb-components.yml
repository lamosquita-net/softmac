name: FlyWeb components server

on:
  push:
    paths: ["FlyWeb/servidor/go-update/**", ".github/workflows/flyweb-components.yml"]
  pull_request:
    paths: ["FlyWeb/servidor/go-update/**", ".github/workflows/flyweb-components.yml"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlyWeb/servidor/go-update
    env:
      GOEXPERIMENT: jsonv2
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: FlyWeb/servidor/go-update/go.mod
          cache-dependency-path: FlyWeb/servidor/go-update/go.sum
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build for ns2 (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -tags=noasm,nounsafe -ldflags "-s -w" -o ../build/flyweb-components .
          cd ../build && sha256sum flyweb-components > flyweb-components.sha256 && cat flyweb-components.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: flyweb-components-linux-amd64
          path: |
            FlyWeb/servidor/build/flyweb-components
            FlyWeb/servidor/build/flyweb-components.sha256

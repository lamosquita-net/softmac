name: BackupDrive

on:
  push:
    paths: ["BackupDrive/**", ".github/workflows/backupdrive.yml"]
  pull_request:
    paths: ["BackupDrive/**", ".github/workflows/backupdrive.yml"]

jobs:
  build-darwin-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache-dependency-path: BackupDrive/rclone/go.sum
      - name: Cross-compile for macOS 10.14 x86_64
        working-directory: BackupDrive/rclone
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=v1.67.0-backupdrive" -o ../build/backupdrive .
          file ../build/backupdrive
      - uses: actions/upload-artifact@v4
        with:
          name: backupdrive-darwin-amd64
          path: |
            BackupDrive/build/backupdrive
            BackupDrive/scripts/backupdrive-sync.sh
            BackupDrive/scripts/mojave-selftest.sh
            BackupDrive/launchd/net.lamosquita.backupdrive.plist

  build-menubar-app:
    # Runner de Apple Silicon: se compila como x86_64 para 10.14 (-arch/-mmacosx-version-min).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build BackupDrive.app (x86_64, macOS 10.14+)
        run: BackupDrive/app/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent BackupDrive/build/BackupDrive.app BackupDrive/build/BackupDrive-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: backupdrive-menubar-app
          path: BackupDrive/build/BackupDrive-app.zip

  package:
    # Un solo zip para instalar en el Mac: descomprimir y ejecutar ./install.sh
    needs: [build-darwin-amd64, build-menubar-app]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backupdrive-darwin-amd64
          path: dl/engine
      - uses: actions/download-artifact@v4
        with:
          name: backupdrive-menubar-app
          path: dl/app
      - name: Assemble BackupDrive/
        run: |
          P=pkg/BackupDrive
          mkdir -p "$P"
          cp dl/engine/build/backupdrive "$P/"
          ditto -x -k dl/app/BackupDrive-app.zip "$P/"
          cp BackupDrive/scripts/install.sh BackupDrive/scripts/backupdrive-sync.sh BackupDrive/scripts/mojave-selftest.sh "$P/"
          cp BackupDrive/launchd/net.lamosquita.backupdrive.plist "$P/"
          cp BackupDrive/LICENSE "$P/LICENSE.txt"
          cp BackupDrive/rclone/COPYING "$P/LICENSE-rclone.txt"
          chmod 755 "$P/backupdrive" "$P"/*.sh
          printf 'BackupDrive (%s)\n\nInstalar:   ./install.sh\nQuitar:     ./install.sh --uninstall\nDetalles:   https://github.com/%s/tree/%s/BackupDrive\n' \
            "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$P/LEEME.txt"
          ls -la "$P"
          file "$P/backupdrive" "$P/BackupDrive.app/Contents/MacOS/BackupDrive"
          cd pkg && ditto -c -k --keepParent BackupDrive ../BackupDrive-mojave.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BackupDrive-mojave
          path: BackupDrive-mojave.zip

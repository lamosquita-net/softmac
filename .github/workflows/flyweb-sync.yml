name: FlyWeb sync server

on:
  push:
    paths: ["FlyWeb/servidor/sync/**", ".github/workflows/flyweb-sync.yml"]
  workflow_dispatch:
  pull_request:
    paths: ["FlyWeb/servidor/sync/**", ".github/workflows/flyweb-sync.yml"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlyWeb/servidor/sync
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: FlyWeb/servidor/sync/go.mod
          cache-dependency-path: FlyWeb/servidor/sync/go.sum
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: go-sync's own tests against the SQLite datastore
        run: pruebas/go-sync.sh
      - name: Build for ns2 (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o ../build/flyweb-sync .
          cd ../build && sha256sum flyweb-sync > flyweb-sync.sha256 && cat flyweb-sync.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flyweb-sync-linux-amd64
          path: |
            FlyWeb/servidor/build/flyweb-sync
            FlyWeb/servidor/build/flyweb-sync.sha256

  # ns2 downloads the binary from the public "flyweb-sync" release (no login) and checks its SHA-256.
  publish:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flyweb-sync-linux-amd64
          path: build
      - name: Upload to the "flyweb-sync" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          cat build/flyweb-sync.sha256
          gh release view flyweb-sync >/dev/null 2>&1 || gh release create flyweb-sync --prerelease \
            --title "flyweb-sync for ns2 (FlyWeb sync server)" \
            --notes "Built by flyweb-sync.yml (linux/amd64, static). Check the SHA-256 before installing."
          gh release upload flyweb-sync build/flyweb-sync build/flyweb-sync.sha256 --clobber
          gh release edit flyweb-sync --notes "Built by flyweb-sync.yml from ${GITHUB_SHA} (linux/amd64, static). SHA-256: $(cut -d' ' -f1 build/flyweb-sync.sha256)"

<style>
@font-face { font-family: "D-DIN"; src: url("fuentes/D-DIN.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "D-DIN"; src: url("fuentes/D-DIN-Bold.woff2") format("woff2"); font-weight: 700; }

:root {
  --naranja: rgb(255, 153, 0);    /* el del icono */
  --rojo:    rgb(210, 10, 17);    /* lamosquita */
  --morado:  rgb(149, 27, 129);   /* desarrollo */
  --texto: #000;                  /* lo cambia cada fondo (FONDOS, más abajo) */
  --pie:   #000;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "D-DIN", sans-serif; color: var(--texto);
  background: #6b6b4a center / cover no-repeat;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}

/* ── Contadores de Escudos ─────────────────────────────── */
.contadores { position: absolute; left: 2.9vw; top: 8.5vh; display: flex; gap: 0; }
.contador { width: 22.6vw; }
.contador:nth-child(3) { width: auto; }
.contador b { display: block; font-weight: 700; font-size: 34px; line-height: 1; }
.contador b small { font-size: 21px; }
.contador span { display: block; margin-top: 8px; font-size: 14px; }
.c1 b { color: var(--naranja); } .c2 b { color: var(--rojo); } .c3 b { color: var(--morado); }

/* ── Accesos ───────────────────────────────────────────── */
.accesos { position: absolute; left: 2.9vw; top: 20.8vh; display: flex; gap: 22px; }
.acceso { width: 50px; text-align: left; text-decoration: none; color: var(--texto); font-size: 12px; }
.acceso i {
  display: grid; place-items: center; width: 48px; height: 48px; border-radius: 8px;
  background: #1f2030; box-shadow: 0 0 0 1px rgba(255,255,255,.08); margin-bottom: 4px;
  font-style: normal; font-weight: 700; font-size: 18px;
}
.acceso em { font-style: normal; white-space: nowrap; }

/* ── Reloj ─────────────────────────────────────────────── */
.reloj { position: absolute; right: 5.3vw; top: 4.8vh; font-weight: 700; font-size: 72px; line-height: 1; color: #000; letter-spacing: -1px; }

/* ── Pie ───────────────────────────────────────────────── */
.credito { position: absolute; left: 2.9vw; bottom: 4.6vh; font-size: 12px; color: var(--pie); }
.botones { position: absolute; right: 8vw; bottom: 4.4vh; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; color: #000; }
.botones svg { width: 14px; height: 14px; fill: none; stroke: #000; stroke-width: 1.4; }
.botones .sep { width: 1px; height: 12px; background: #000; margin: 0 2px; }

/* ── La mosca ──────────────────────────────────────────── */
.mosca { position: absolute; left: 0; top: 0; width: 76px; height: 76px; pointer-events: none; }
/* Sin will-change: en la 6,1 (FirePro D500, Mojave) con la pantalla en modo escalado, la capa propia de la mosca
   provoca una línea intermitente en toda la pantalla (03/10). Sin capa, nada; tu web tampoco la usa. */
.mosca svg { width: 100%; height: 100%; overflow: visible; }
.mosca .ala { transition: opacity .25s; }
body.sin-alas .mosca .ala { animation: none !important; opacity: .4; }
.mosca.vuela .ala { animation: aleteo .09s steps(2, jump-none) infinite alternate; }
@keyframes aleteo { from { opacity: .4; } to { opacity: .12; } }

/* ── Sólo del prototipo ────────────────────────────────── */
.proto { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; opacity: .25; transition: opacity .2s; font-size: 11px; }
.proto:hover { opacity: 1; }
.proto button { font: inherit; border: 0; border-radius: 4px; padding: 3px 7px; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
.proto button.activo { background: #000; }
#ruta { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
body.ver-ruta #ruta { display: block; }
</style>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     AJUSTES — lo que se toca para afinar el vuelo.
     ═══════════════════════════════════════════════════════════════ */
  var AJUSTES = {
    velocidad:  105,   // píxeles por segundo en vuelo (a 1280 de ancho; escala con la ventana)
    variacion:  0.18,  // cada tramo va entre un 18 % más lento y un 18 % más rápido
    ondulacion: 10,    // píxeles que sube y baja sobre la ruta mientras vuela
    temblor:    2.5,   // tembleque rápido mientras vuela
    posado:     [2.5, 7],  // segundos que se queda en cada posadero (al azar entre los dos)
    saltarse:   0.2,   // probabilidad de pasar de largo por un posadero
    giroPosado: [35, 150], // al posarse se gira al azar entre estos grados (a un lado o al otro)
    rumbo:      -53,   // hacia dónde mira el dibujo (0 = derecha; la cabeza va arriba a la derecha)
    calma:      { velocidad: 0.35, amplitud: 0.3 }  // con «reducir movimiento»
  };

  /* La ruta: un bucle cerrado que pasa por estos puntos (0..1 del ancho y el alto de la ventana).
     Evita los contadores, los accesos, el reloj y el pie. Los marcados con «posa» son posaderos. */
  var RUTA = [   // ocho tumbado y desigual (maqueta de Titín, 03/10): pasa dos veces por el cruce y para en uno de los dos pasos
    { x: 0.539, y: 0.625 },
    { x: 0.508, y: 0.500 },
    { x: 0.453, y: 0.412 },
    { x: 0.352, y: 0.375 },
    { x: 0.234, y: 0.369 },
    { x: 0.133, y: 0.381, posa: true },
    { x: 0.086, y: 0.438 },
    { x: 0.047, y: 0.537 },
    { x: 0.035, y: 0.650 },
    { x: 0.055, y: 0.775 },
    { x: 0.109, y: 0.875 },
    { x: 0.195, y: 0.925 },
    { x: 0.297, y: 0.931 },
    { x: 0.406, y: 0.900 },
    { x: 0.484, y: 0.838 },
    { x: 0.531, y: 0.750 },
    { x: 0.539, y: 0.562 },
    { x: 0.547, y: 0.412 },
    { x: 0.578, y: 0.312 },
    { x: 0.648, y: 0.237 },
    { x: 0.734, y: 0.215 },
    { x: 0.812, y: 0.231 },
    { x: 0.852, y: 0.275 },
    { x: 0.859, y: 0.331 },
    { x: 0.845, y: 0.412, posa: true },
    { x: 0.867, y: 0.481 },
    { x: 0.906, y: 0.562 },
    { x: 0.928, y: 0.675 },
    { x: 0.914, y: 0.775 },
    { x: 0.859, y: 0.850 },
    { x: 0.781, y: 0.887 },
    { x: 0.711, y: 0.894 },
    { x: 0.648, y: 0.850 },
    { x: 0.602, y: 0.775 },
    { x: 0.566, y: 0.700, posa: true }
  ];

  /* Cada fondo: color de los textos que lo pisan y del crédito. */
  var FONDOS = [
    { img: 'fondos/fondo-1.jpg', texto: '#000', pie: '#000' },
    { img: 'fondos/fondo-2.jpg', texto: '#000', pie: '#000' },
    { img: 'fondos/fondo-3.jpg', texto: '#fff', pie: '#fff' },
    { img: 'fondos/fondo-4.jpg', texto: '#000', pie: '#fff' },
    { img: 'fondos/fondo-5.jpg', texto: '#000', pie: '#000' },
    { img: 'fondos/fondo-6.jpg', texto: '#fff', pie: '#fff' },
    { img: 'fondos/fondo-7.jpg', texto: '#000', pie: '#000' }   // en la maqueta salía en blanco por error
  ];
  /* ═══════════════════ fin de los ajustes ══════════════════════ */

  var reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CALMA  = reducir ? AJUSTES.calma.velocidad : 1;
  var AMPLIA = reducir ? AJUSTES.calma.amplitud  : 1;

  var mosca = document.getElementById('mosca');
  var tabla = [], largo = 0, posaderos = [];

  /* Curva cerrada (Catmull-Rom) por los puntos de RUTA, muestreada y medida
     para que la mosca vaya a velocidad constante. */
  function punto(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    function c(a, b, c_, d) { return 0.5 * (2 * b + (-a + c_) * t + (2 * a - 5 * b + 4 * c_ - d) * t2 + (-a + 3 * b - 3 * c_ + d) * t3); }
    return { x: c(p0.x, p1.x, p2.x, p3.x), y: c(p0.y, p1.y, p2.y, p3.y) };
  }
  function medir() {
    var W = innerWidth, H = innerHeight, n = RUTA.length, PASOS = 60;
    var P = RUTA.map(function (r) { return { x: r.x * W, y: r.y * H }; });
    tabla = []; posaderos = []; largo = 0;
    var prev = null;
    for (var i = 0; i < n; i++) {
      if (RUTA[i].posa) { posaderos.push(largo); }
      for (var k = 0; k < PASOS; k++) {
        var q = punto(P[(i - 1 + n) % n], P[i], P[(i + 1) % n], P[(i + 2) % n], k / PASOS);
        if (prev) { largo += Math.hypot(q.x - prev.x, q.y - prev.y); }
        tabla.push({ d: largo, x: q.x, y: q.y });
        prev = q;
      }
    }
    largo += Math.hypot(tabla[0].x - prev.x, tabla[0].y - prev.y);
    dibujarRuta();
  }
  function en(d) {  // punto de la ruta a la distancia d
    d = ((d % largo) + largo) % largo;
    var lo = 0, hi = tabla.length - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (tabla[mid].d <= d) { lo = mid; } else { hi = mid - 1; } }
    var a = tabla[lo], b = tabla[(lo + 1) % tabla.length];
    var tramo = (b.d > a.d ? b.d : largo) - a.d, f = tramo ? (d - a.d) / tramo : 0;
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }

  /* Estado del vuelo: vuela hacia el siguiente posadero, se posa un rato y sigue. */
  var ENTEROS = false;
  var enderezaDesde = -9, sinParar = false, giroIni = 0, giroFin = 0, girandoDesde = 0;
  var d = 0, destino = 0, desde = 0, inicioTramo = 0, duracion = 1, posadoHasta = 0, volando = false, angulo = 0;
  function siguientePosadero() {
    // el siguiente posadero por delante; a veces se lo salta y va al otro
    var orden = posaderos.map(function (p) { var x = p - (d % largo); return x <= 1 ? x + largo : x; }).sort(function (a, b) { return a - b; });
    var salto = orden[0];
    if (orden.length > 1 && Math.random() < AJUSTES.saltarse) { salto = orden[1]; }
    return salto;
  }
  function despegar(ahora) {
    var tramo = siguientePosadero();
    var escala = innerWidth / 1280;
    var vel = AJUSTES.velocidad * escala * CALMA * (1 + (Math.random() * 2 - 1) * AJUSTES.variacion);
    angulo += giroFin; giroFin = 0; enderezaDesde = ahora;
    desde = d; destino = d + tramo; inicioTramo = ahora; duracion = tramo / vel; volando = true;
    mosca.classList.add('vuela');
  }
  function posar(ahora) {
    volando = false; d = destino;
    var g = AJUSTES.giroPosado, lado = Math.random() < 0.5 ? -1 : 1;
    giroIni = 0; giroFin = lado * (g[0] + Math.random() * (g[1] - g[0])) * AMPLIA; girandoDesde = ahora;
    var r = AJUSTES.posado; posadoHasta = ahora + (sinParar ? 0.3 : (r[0] + Math.random() * (r[1] - r[0])) / CALMA);
    mosca.classList.remove('vuela');
  }

  var arranque = null, previa = null;
  function volar(marca) {
    if (arranque === null) { arranque = previa = marca; d = posaderos[Math.floor(Math.random() * posaderos.length)]; posar(0); posadoHasta = 1.5; }
    var hueco = marca - previa; if (hueco > 800) { arranque += hueco - 16; }  // pestaña oculta: sin saltos
    previa = marca;
    var t = (marca - arranque) / 1000;

    var x, y, giro;
    if (volando) {
      var f = Math.min(1, (t - inicioTramo) / duracion);
      var s = f * f * (3 - 2 * f);                 // arranca y frena suave
      d = desde + (destino - desde) * s;
      var p = en(d), q = en(d + 30);
      var sube = Math.sin(f * Math.PI) * Math.sin(t * 2.1) * AJUSTES.ondulacion * AMPLIA;
      x = p.x + Math.sin(t * 23) * AJUSTES.temblor * AMPLIA;
      y = p.y + sube + Math.cos(t * 19) * AJUSTES.temblor * AMPLIA;
      var rumboVuelo = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      var fe = Math.min(1, (t - enderezaDesde) / 0.4);              // al despegar endereza en 0,4 s
      var dif = ((rumboVuelo - angulo + 540) % 360) - 180;          // por el camino corto
      angulo = fe < 1 ? angulo + dif * fe : rumboVuelo;
      giro = angulo - AJUSTES.rumbo;
      if (f >= 1) { posar(t); }
    } else {
      var p2 = en(d);
      // posada: se limpia las patas — giros cortos de pocos grados, sin moverse
      x = p2.x; y = p2.y;
      var fg = Math.min(1, (t - girandoDesde) / 0.6), eg = 1 - Math.pow(1 - fg, 3);   // gira en 0,6 s y frena
      giro = angulo - AJUSTES.rumbo + giroIni + (giroFin - giroIni) * eg + Math.sin(t * 1.3) * 6 * AMPLIA + (Math.sin(t * 7) > 0.97 ? 4 : 0);
      if (t > posadoHasta) { despegar(t); }
    }
    if (ENTEROS) { x = Math.round(x); y = Math.round(y); giro = Math.round(giro); }
    mosca.style.transform = 'translate(' + (x - 38) + 'px,' + (y - 38) + 'px) rotate(' + giro + 'deg)';
    requestAnimationFrame(volar);
  }

  /* Reloj */
  function reloj() {
    var h = new Date();
    document.getElementById('reloj').textContent = String(h.getHours()).padStart(2, '0') + ':' + String(h.getMinutes()).padStart(2, '0');
  }
  reloj(); setInterval(reloj, 5000);

  /* ── Sólo del prototipo: cambiar de fondo (1–7, ← →) y ver la ruta (R) ── */
  var actual = 0;
  function fondo(i) {
    actual = (i + FONDOS.length) % FONDOS.length;
    var f = FONDOS[actual];
    document.body.style.backgroundImage = 'url("' + f.img + '")';
    document.documentElement.style.setProperty('--texto', f.texto);
    document.documentElement.style.setProperty('--pie', f.pie);
    document.querySelectorAll('.proto button.n').forEach(function (b, k) { b.classList.toggle('activo', k === actual); });
    try { history.replaceState(null, '', '#' + (actual + 1)); } catch (e) {}
  }
  var proto = document.getElementById('proto');
  FONDOS.forEach(function (_, k) { var b = document.createElement('button'); b.className = 'n'; b.textContent = k + 1; b.onclick = function () { fondo(k); }; proto.appendChild(b); });
  var bv = document.createElement('button'); bv.textContent = 'sin paradas'; bv.onclick = function () { sinParar = !sinParar; bv.classList.toggle('activo', sinParar); if (sinParar && !volando) { posadoHasta = 0; } }; proto.appendChild(bv);
  // Pruebas del artefacto de pantalla en la 6,1: cada botón quita una cosa (marcado = quitado)
  [['sin aleteo', function (on) { document.body.classList.toggle('sin-alas', on); }],
   ['px enteros', function (on) { ENTEROS = on; }]].forEach(function (o) {
    var b = document.createElement('button'), on = false; b.textContent = o[0];
    b.onclick = function () { on = !on; b.classList.toggle('activo', on); o[1](on); }; proto.appendChild(b);
  });
  var br = document.createElement('button'); br.textContent = 'ruta'; br.onclick = function () { document.body.classList.toggle('ver-ruta'); }; proto.appendChild(br);
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { fondo(actual + 1); } else if (e.key === 'ArrowLeft') { fondo(actual - 1); }
    else if (e.key >= '1' && e.key <= '7') { fondo(+e.key - 1); } else if (e.key === 'v' || e.key === 'V') { bv.click(); } else if (e.key === 'r' || e.key === 'R') { document.body.classList.toggle('ver-ruta'); }
  });
  function dibujarRuta() {
    var s = document.getElementById('ruta'), pts = tabla.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var marcas = posaderos.map(function (d0) { var p = en(d0); return '<circle cx="' + p.x + '" cy="' + p.y + '" r="7" fill="none" stroke="#f90" stroke-width="2"/>'; }).join('');
    s.innerHTML = '<polygon points="' + pts + '" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-dasharray="6 6"/>' + marcas;
  }

  var espera;
  addEventListener('resize', function () { clearTimeout(espera); espera = setTimeout(medir, 150); });
  fondo((parseInt(location.hash.slice(1), 10) || 1) - 1);
  medir();
  requestAnimationFrame(volar);
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FM.28 — caídas conocidas</title>
<!-- Comprobación de caídas de la 1.15.2 (FM.28, MOTOR-13). Abrir en FlyWeb; si la pestaña muestra «¡Vaya!» o deja de
     responder, la caída sigue ahí. Una prueba por recuadro; el título cambia a «ok» si todas llegan al final.
     1. Upstream 12bfef324f99 (crbug.com/1458561): getComputedStyle() de un absoluto tras un layout de subárbol. La 1.15
        y la 1.15.1 deberían caerse (CHECK); la 1.15.2 (f12 en adelante), no.
     2. Upstream 1624b1441b9: container query + capa superior (se cae la 1.15.1 y la F9). Están en la WPT del 131:
        css/css-conditional/container-queries/crashtests/top-layer-crash.html y top-layer-nested-crash.html. -->
<style>
  :root { font: 15px/1.5 -apple-system, sans-serif; }
  .c { position: relative; width: 100px; height: 100px; background: #cfc; margin: 4px; }
  .o { position: absolute; width: 30px; height: 30px; top: 10%; left: auto; overflow: hidden; background: #f9c; }
</style>
</head>
<body>
<h1>FM.28: caídas conocidas</h1>
<p id="r">corriendo…</p>
<div class="c"><div id="t1" class="o">hola</div></div>
<div class="c"><div id="t2" class="o"><div>hola</div></div></div>
<script>
  // Cada absoluto tiene tamaño fijo y overflow:hidden: es un límite de relayout. Cambiar su texto provoca un layout de
  // subárbol; luego se piden insets que no son fijos (10 % y auto), que salen del resultado de layout guardado.
  document.body.offsetTop;
  t1.innerText = 'boom';
  const a = getComputedStyle(t1).top + ' ' + getComputedStyle(t1).left;
  document.body.offsetTop;
  t2.firstChild.innerText = 'boom';
  const b = getComputedStyle(t2).top + ' ' + getComputedStyle(t2).left;
  document.getElementById('r').textContent = `ok (${a}; ${b})`;
  document.title = 'ok';
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Regexps con SIMD — comprobación</title>
<!-- Nivel 130 (FS.14): la V8 13.0 enciende por defecto `regexp_simd`. Cuando una expresión regular empieza por una clase
     de caracteres y el texto es de un byte (Latin-1), el código nativo de irregexp salta hasta el primer candidato con
     instrucciones SIMD (SSSE3: pshufb, pmovmskb; las de AVX solo si la CPU las tiene). La MacPro5,1 no tiene AVX: esta
     página comprueba allí que esas búsquedas dan lo mismo que un buscador escrito en JS sin regexps y que la pestaña no
     se cierra (una instrucción que la CPU no tenga la mata con SIGILL). Cada expresión se ejecuta muchas veces para que
     V8 la pase de bytecode a código nativo. Abrir con file:// (no carga nada de fuera). Cada línea dice ok o FALLO. -->
<style>
  :root { color-scheme: light; font: 15px/1.5 -apple-system, sans-serif; }
  body { margin: 2em; max-width: 60em; }
  li.ok::marker { content: "ok  "; color: green; }
  li.fallo::marker { content: "FALLO  "; color: #c00; font-weight: bold; }
  #fin { font-weight: bold; }
</style>
</head>
<body>
<h1>Expresiones regulares con SIMD (V8 13.0)</h1>
<p id="ua"></p>
<ul id="res"></ul>
<p id="fin">Probando…</p>
<script>
  const res = document.getElementById('res');
  let fallos = 0;
  const anota = (ok, texto) => {
    if (!ok) fallos++;
    const li = document.createElement('li'); li.className = ok ? 'ok' : 'fallo';
    li.textContent = texto; res.append(li);
  };
  document.getElementById('ua').textContent = navigator.userAgent;

  // Generador repetible (no depende de Math.random): mismas cadenas en todos los Mac.
  let semilla = 130;
  const azar = (n) => { semilla = (semilla * 1103515245 + 12345) >>> 0; return semilla % n; };
  const ALFABETO = 'abcdefghijklmnopqrstuvwxyz0123456789 .,-_áéíóúñ ÿ';
  const texto = (largo) => { let s = ''; for (let i = 0; i < largo; i++) s += ALFABETO[azar(ALFABETO.length)]; return s; };

  // Cada caso: la expresión y un buscador en JS puro que devuelve todas las posiciones de coincidencia (sin solapes).
  const enClase = (conj) => (c) => conj.includes(c);
  const casos = [
    { re: /[aeiou]x/g, largo: 2, partes: [enClase('aeiou'), enClase('x')] },
    { re: /[0-9][a-f]/g, largo: 2, partes: [enClase('0123456789'), enClase('abcdef')] },
    { re: /[qz]/g, largo: 1, partes: [enClase('qz')] },  // con SIMD
    { re: /[ñÿ]k/g, largo: 2, partes: [enClase('ñÿ'), enClase('k')] },
    { re: /[  ][.,]/g, largo: 2, partes: [enClase('  '), enClase('.,')] },
    { re: /[k-m]{3}/g, largo: 3, partes: [enClase('klm'), enClase('klm'), enClase('klm')] },
    // Estas tres van por el salto con SIMD (SkipUntilBitInTable con advance_by = 1, comprobado con
    // d8 --trace-regexp-assembler); las demás, por el salto escalar o sin salto.
    { re: /[a-f][0-9][x-z]/g, largo: 3, partes: [enClase('abcdef'), enClase('0123456789'), enClase('xyz')] },
    { re: /[aeiouáéíóú]/g, largo: 1, partes: [enClase('aeiouáéíóú')] },
  ];
  const buscaJS = (caso, s) => {
    const r = [];
    for (let i = 0; i + caso.largo <= s.length; ) {
      let ok = true;
      for (let k = 0; k < caso.largo; k++) if (!caso.partes[k](s[i + k])) { ok = false; break; }
      if (ok) { r.push(i); i += caso.largo; } else i++;
    }
    return r;
  };
  const buscaRE = (re, s) => { const r = []; re.lastIndex = 0; let m; while ((m = re.exec(s))) r.push(m.index); return r; };
  const iguales = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  const prueba = () => {
    // Largos alrededor de 16 bytes (el ancho de un registro SIMD) y largos grandes, con la coincidencia también al final.
    const largos = [];
    for (let n = 0; n <= 40; n++) largos.push(n);
    largos.push(63, 64, 65, 127, 128, 129, 1000, 4097, 65536);
    for (const caso of casos) {
      let malos = 0, primera = '';
      for (let vuelta = 0; vuelta < 30; vuelta++) {
        for (const n of largos) {
          let s = texto(n);
          // A veces, coincidencia forzada justo al final del texto.
          if (n >= caso.largo && vuelta % 3 === 0) {
            let fin = '';
            for (let k = 0; k < caso.largo; k++) fin += [...ALFABETO].find(caso.partes[k]);
            s = s.slice(0, n - caso.largo) + fin;
          }
          const a = buscaRE(caso.re, s), b = buscaJS(caso, s);
          if (!iguales(a, b)) { malos++; if (!primera) primera = `largo ${n}: regexp ${a.slice(0, 5)} / JS ${b.slice(0, 5)}`; }
        }
      }
      anota(malos === 0, `${caso.re} — ${malos === 0 ? 'iguales en todos los largos' : malos + ' diferencias; ' + primera}`);
    }
    // Lo mismo con `search` y `test` (otros caminos de entrada a irregexp), muchas veces seguidas.
    const s = texto(5000) + 'zq9f';
    let ok = true;
    for (let i = 0; i < 20000; i++) {
      if (s.search(/[0-9][a-f]$/) !== s.length - 2) { ok = false; break; }
      if (!/[qz]{2}/.test(s.slice(-4))) { ok = false; break; }
    }
    anota(ok, 'search() y test() en código nativo, 20 000 veces');
    // Texto de dos bytes: no usa SIMD, pero tiene que seguir igual.
    const s2 = texto(300) + '中ax';
    anota(iguales(buscaRE(/[aeiou]x/g, s2), buscaJS(casos[0], s2)), 'texto de dos bytes (sin SIMD)');
    document.getElementById('fin').textContent = fallos === 0
      ? 'Todo bien: la pestaña no se ha cerrado y los resultados coinciden.'
      : `${fallos} FALLOS: avisar a SEGURIDAD-PORTES con esta página (captura) y el modelo de Mac.`;
  };
  setTimeout(prueba, 0);
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Llamadas rápidas — comprobación</title>
<!-- Nivel 129, paso de V8 (FM.19, MOTOR-8): con la V8 12.9, las llamadas rápidas de V8 ([NoAllocDirectCall] de canvas 2D,
     WebGL y WebGPU) ya no tienen «fallback» y lanzan las excepciones ellas mismas (d9bfd74484c). Esta página calienta
     cada método para que TurboFan use la llamada rápida y después le pasa un argumento que debe lanzar: tiene que lanzar
     lo mismo que en la 1.12.2 y en Chrome, sin cerrar la pestaña. Abrir desde http://127.0.0.1 (no carga nada de fuera;
     con file:// fallan a propósito las dos pruebas de JIT y Wasm, que solo valen en un origen web); también en el ASan. Cada línea dice ok o FALLO. -->
<style>
  :root { color-scheme: light; font: 15px/1.5 -apple-system, sans-serif; }
  body { margin: 2em; max-width: 60em; }
  li.ok::marker { content: "ok  "; color: green; }
  li.fallo::marker { content: "FALLO  "; color: #c00; font-weight: bold; }
</style>
</head>
<body>
<h1>Llamadas rápidas que lanzan excepciones</h1>
<p id="ua"></p>
<ul id="res"></ul>
<script>
  const res = document.getElementById('res');
  const prueba = (nombre, f) => {
    let ok = false, nota = '';
    try { const r = f(); ok = r === true || (r && r.ok); nota = (r && r.nota) || ''; } catch (e) { nota = 'excepción fuera de la prueba: ' + e; }
    const li = document.createElement('li'); li.className = ok ? 'ok' : 'fallo';
    li.textContent = nombre + (nota ? ` — ${nota}` : ''); res.append(li);
  };
  document.getElementById('ua').textContent = navigator.userAgent;
  const VUELTAS = 50000;
  // Basura para que haya GC durante el calentamiento (en la 12.9 una llamada rápida puede provocar GC).
  let basura = [];
  const ensucia = (i) => { if (i % 64 === 0) basura.push(new Array(32).fill(i)); if (basura.length > 2000) basura = []; };
  // Calienta f(arg bueno) y luego llama f(arg malo) desde el mismo sitio; devuelve el nombre de lo que lanzó.
  const lanza = (f, bueno, malo) => {
    for (let i = 0; i < VUELTAS; i++) { f(bueno); ensucia(i); }
    try { f(malo); return 'nada'; } catch (e) { return e && e.name ? `${e.name}: ${e.message}` : String(e); }
  };
  const espera = (r, nombre) => ({ ok: r.startsWith(nombre), nota: r });

  // Canvas 2D (CanvasPath: [NoAllocDirectCall, RaisesException])
  const c2 = document.createElement('canvas').getContext('2d');
  prueba('canvas 2D arc() con radio negativo lanza IndexSizeError',
    () => espera(lanza(r => c2.arc(10, 10, r, 0, 1), 5, -1), 'IndexSizeError'));
  prueba('canvas 2D ellipse() con radio negativo lanza IndexSizeError',
    () => espera(lanza(r => c2.ellipse(10, 10, r, 5, 0, 0, 1), 5, -1), 'IndexSizeError'));
  prueba('canvas 2D arcTo() con radio negativo lanza IndexSizeError',
    () => espera(lanza(r => c2.arcTo(0, 0, 10, 10, r), 5, -1), 'IndexSizeError'));
  prueba('Path2D arc() con radio negativo lanza IndexSizeError',
    () => { const p = new Path2D(); return espera(lanza(r => p.arc(10, 10, r, 0, 1), 5, -1), 'IndexSizeError'); });
  prueba('OffscreenCanvas 2D arc() con radio negativo lanza IndexSizeError',
    () => { const o = new OffscreenCanvas(20, 20).getContext('2d');
            return espera(lanza(r => o.arc(10, 10, r, 0, 1), 5, -1), 'IndexSizeError'); });
  prueba('canvas 2D sigue dibujando después (lineTo/moveTo rápidos)',
    () => { const cv = document.createElement('canvas'); cv.width = cv.height = 4; const x = cv.getContext('2d');
            for (let i = 0; i < VUELTAS; i++) { x.moveTo(0, 0); x.lineTo(4, 4); }
            x.fillStyle = '#f00'; x.fillRect(0, 0, 4, 4);
            const d = x.getImageData(1, 1, 1, 1).data; return { ok: d[0] === 255 && d[3] === 255, nota: d.join(',') }; });

  // WebGL
  const gl = document.createElement('canvas').getContext('webgl');
  if (!gl) {
    prueba('WebGL disponible', () => ({ ok: false, nota: 'sin contexto WebGL: probar en un Mac con GPU' }));
  } else {
    const buf = gl.createBuffer();
    prueba('WebGL bindBuffer() con un objeto que no es WebGLBuffer lanza TypeError',
      () => espera(lanza(b => gl.bindBuffer(gl.ARRAY_BUFFER, b), buf, {}), 'TypeError'));
    const boom = { valueOf() { throw new RangeError('boom'); } };
    prueba('WebGL uniform1fv() propaga la excepción de valueOf() de un elemento',
      () => espera(lanza(v => gl.uniform1fv(null, v), [1, 2], [1, boom]), 'RangeError'));
    prueba('WebGL uniform4fv() con un elemento que no es número lanza o convierte como antes',
      () => { const r = lanza(v => gl.uniform4fv(null, v), [1, 2, 3, 4], [1, 2, 3, Symbol('x')]);
              return espera(r, 'TypeError'); });
    prueba('WebGL: un búfer de otro contexto da INVALID_OPERATION sin cerrar la pestaña (aviso en consola desde la llamada rápida)',
      () => { const gl2 = document.createElement('canvas').getContext('webgl'); if (!gl2) return { ok: false, nota: 'sin segundo contexto' };
              const ajeno = gl2.createBuffer(); while (gl.getError() !== gl.NO_ERROR) {}
              for (let i = 0; i < VUELTAS; i++) gl.bindBuffer(gl.ARRAY_BUFFER, buf);
              gl.bindBuffer(gl.ARRAY_BUFFER, ajeno); const e = gl.getError();
              return { ok: e === gl.INVALID_OPERATION, nota: '0x' + e.toString(16) }; });
    prueba('WebGL clear() rápido sigue funcionando',
      () => { for (let i = 0; i < VUELTAS; i++) { gl.clearColor(0, 1, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
              const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
              return { ok: px[1] === 255, nota: px.join(',') }; });
  }
  // JIT y WebAssembly en un origen web (COORDINACIÓN-6, 15-10). La decisión de JIT es por sitio: en about:blank o file://
  // no se ve (así se escapó en el Static del 130 con una política vieja). Desde la V8 13.0, sin JIT tampoco hay
  // WebAssembly, como en Chrome 130.
  const enWeb = location.protocol === 'http:' || location.protocol === 'https:';
  prueba('WebAssembly en un origen http(s)', () => ({ ok: enWeb && typeof WebAssembly === 'object',
    nota: enWeb ? `typeof WebAssembly: ${typeof WebAssembly}` : `abrir desde http://127.0.0.1 (ahora ${location.protocol})` }));
  prueba('JIT en un origen http(s): bucle de 5e7 vueltas en menos de 600 ms', () => {
    const t0 = performance.now(); let s = 0;
    for (let i = 0; i < 5e7; i++) s = (s + i) | 0;
    const ms = Math.round(performance.now() - t0);
    return { ok: enWeb && ms < 600, nota: `${ms} ms (con JIT ~200–250 ms; sin JIT ~1150 ms)` +
      (enWeb ? '' : `; abrir desde http://127.0.0.1 (ahora ${location.protocol})`) };
  });
  if (typeof gc === 'function') { gc(); prueba('gc() después de todo', () => true); }
</script>
</body>
</html>

<!DOCTYPE html>
<meta charset="utf-8">
<title>idb</title>
<p>IndexedDB intensivo (fin de punto de control de microtareas, V8 12.8): transacciones en bucle mezcladas con
promesas, <code>queueMicrotask</code> y temporizadores.</p>
<pre id="r">en marcha</pre>
<script>
const r = document.getElementById('r');
const abre = () => new Promise((ok, mal) => {
  const q = indexedDB.open('flyweb-idb', 1);
  q.onupgradeneeded = () => q.result.createObjectStore('s');
  q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error);
});
const tx = (db, i) => new Promise((ok, mal) => {
  const t = db.transaction('s', 'readwrite');
  const s = t.objectStore('s');
  s.put({ i, texto: 'x'.repeat(200) }, 'k' + (i % 500));
  s.get('k' + ((i * 7) % 500)).onsuccess = () => queueMicrotask(() => {});
  t.oncomplete = () => Promise.resolve().then(ok); t.onerror = () => mal(t.error);
});
(async () => {
  const t0 = performance.now(); let n = 0;
  try {
    const db = await abre();
    for (let ronda = 0; ronda < 40; ronda++) {
      await Promise.all(Array.from({ length: 50 }, (_, j) => tx(db, ronda * 50 + j)));
      n += 50;
      await new Promise(ok => setTimeout(ok, 0));
    }
    const total = await new Promise(ok => { const q = db.transaction('s').objectStore('s').count(); q.onsuccess = () => ok(q.result); });
    db.close();
    r.textContent = `hecho: ${n} transacciones, ${total} claves, ${Math.round(performance.now() - t0)} ms`;
  } catch (e) { r.textContent = 'ERROR ' + e; }
  document.title = 'idb: hecho';
})();
</script>

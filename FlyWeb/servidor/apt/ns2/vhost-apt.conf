# apt.flyweb.lamosquita.net: repositorio apt de FlyWeb (U4). Va al final de sites-available/lamosquita.conf.
<VirtualHost *:80>
    ServerName apt.flyweb.lamosquita.net
    Redirect permanent / https://apt.flyweb.lamosquita.net/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName apt.flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/FlyWeb/apt
        # Sin listado, sin enlaces simbólicos y solo los ficheros que pide apt; todo lo demás, 403 (la raíz, 404).
        <Directory /var/www/FlyWeb/apt>
            Options None
            AllowOverride None
            Require all denied
        </Directory>
        <DirectoryMatch "^/var/www/FlyWeb/apt/dists/(stable|pruebas)(/|$)">
            <FilesMatch "^(InRelease|Release|Release\.gpg|Packages|Packages\.xz|[0-9a-f]{64})$">
                Require all granted
            </FilesMatch>
        </DirectoryMatch>
        <Directory /var/www/FlyWeb/apt/pool/main/f/flyweb>
            <FilesMatch "^flyweb_[0-9][0-9A-Za-z.+~-]*_amd64\.deb$">
                Require all granted
            </FilesMatch>
        </Directory>
        RedirectMatch 404 "^/$"
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Content-Security-Policy "default-src 'none'"
        Header always set X-Content-Type-Options "nosniff"
        # Sin IP, como updates.
        LogFormat "%t \"%r\" %>s %b" sinip
        ErrorLog /var/log/flyweb/apt/apache_error.log
        ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
        CustomLog /var/log/flyweb/apt/apache_access.log sinip
        <FilesMatch "^(InRelease|Release|Release\.gpg|Packages|Packages\.xz)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "(\.deb|^[0-9a-f]{64})$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </VirtualHost>
</IfModule>

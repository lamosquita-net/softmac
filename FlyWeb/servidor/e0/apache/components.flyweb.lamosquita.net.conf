# components.flyweb.lamosquita.net — servidor de componentes de FlyWeb (Fase 2).
# Destino: /etc/apache2/sites-available/components.flyweb.lamosquita.net.conf
# Módulos: ssl, headers, http2, proxy, proxy_http.
# Apache no admite comentarios al final de una directiva: siempre en su propia línea.
#
# PRIVACIDAD: este vhost no guarda direcciones IP en ningún sitio.
# - Registro de accesos sin %h (IP), sin User-Agent ni Referer.
# - Registro de errores con ErrorLogFormat sin %a (Apache pone "[client IP]" por defecto).
# - ProxyAddHeaders Off: el servicio (go-update) no recibe X-Forwarded-For; solo ve 127.0.0.1.
# - En /var/log/flyweb/, fuera de /var/log/apache2/: ni fail2ban ni CrowdSec leen estos ficheros.
# SEGURIDAD sin baneos propios: solo responden tres rutas y con métodos cerrados; todo lo demás
# es 403. Los baneos globales del cortafuegos (CrowdSec por otros sitios) siguen aplicando.

# Requiere la conf "flyweb" (formato de registro sin IP, clave de servicio, <Directory /srv/flyweb>)
# y el vhost flyweb-http.conf (puerto 80 y reto de Let's Encrypt).

<VirtualHost *:443>
    ServerName components.flyweb.lamosquita.net
    Protocols h2 http/1.1
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # Certificado propio de FlyWeb para los tres subdominios (certbot certonly --cert-name flyweb).
    SSLCertificateFile    /etc/letsencrypt/live/flyweb/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/flyweb/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'"
    Header always set Referrer-Policy "no-referrer"

    CustomLog /var/log/flyweb/components-access.log flyweb_sinip
    ErrorLog  /var/log/flyweb/components-error.log
    ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
    LogLevel warn

    # Las consultas Omaha son XML/JSON de pocos KB.
    LimitRequestBody 65536

    # Raíz vacía (no heredar /var/www/html) y todo denegado salvo lo que se abre abajo.
    DocumentRoot "/srv/flyweb/components/vacio"
    <Location "/">
        Require all denied
    </Location>

    # Consultas del actualizador: solo POST, al servicio en 127.0.0.1, sin la IP del cliente.
    ProxyRequests Off
    ProxyAddHeaders Off
    ProxyPreserveHost On
    ProxyTimeout 30
    ProxyPass        "/extensions" "http://127.0.0.1:8192/extensions"
    ProxyPassReverse "/extensions" "http://127.0.0.1:8192/extensions"
    # Las descargas de /release/ no llevan la cabecera: la clave solo se exige aquí.
    <Location "/extensions">
        <RequireAll>
            Require method POST
            # Formato obligatorio (openssl rand -hex 32): si faltara el fichero de claves, el literal
            # "${FLYWEB_KEY_ACTUAL}" no pasa; la clave de ejemplo sin cambiar, tampoco.
            Require expr "%{HTTP:BraveServiceKey} =~ /^[0-9a-f]{64}$/ && (%{HTTP:BraveServiceKey} == '${FLYWEB_KEY_ACTUAL}' || %{HTTP:BraveServiceKey} == '${FLYWEB_KEY_ANTERIOR}')"
        </RequireAll>
    </Location>

    # Paquetes CRX copiados de Brave y Google (sin modificar): solo GET/HEAD.
    Alias "/release/" "/srv/flyweb/components/release/"
    <Directory "/srv/flyweb/components/release">
        <RequireAll>
            Require all granted
            Require method GET HEAD
        </RequireAll>
    </Directory>
    <Location "/release/">
        <RequireAll>
            Require all granted
            Require method GET HEAD
        </RequireAll>
    </Location>
    AddType application/x-chrome-extension .crx

    # Estado del último despliegue (lo escribe flyweb-deploy; sin datos internos): solo GET/HEAD.
    Alias "/_estado.json" "/srv/flyweb/components/estado/_estado.json"
    <Location "/_estado.json">
        <RequireAll>
            Require all granted
            Require method GET HEAD
        </RequireAll>
    </Location>
    <Directory "/srv/flyweb/components/estado">
        Require all granted
    </Directory>
</VirtualHost>

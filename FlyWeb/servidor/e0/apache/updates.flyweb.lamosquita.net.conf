# Destino: /etc/apache2/sites-available/updates.flyweb.lamosquita.net.conf
# Actualizaciones del navegador (appcast de Sparkle y .dmg, S2). Módulos: ssl, headers, http2, mime.
<VirtualHost *:443>
    ServerName updates.flyweb.lamosquita.net
    DocumentRoot "/srv/flyweb/updates"
    Protocols h2 http/1.1
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/letsencrypt/live/flyweb/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/flyweb/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'"
    Header always set Referrer-Policy "no-referrer"

    CustomLog /var/log/flyweb/updates-access.log flyweb_sinip
    ErrorLog  /var/log/flyweb/updates-error.log
    ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
    LogLevel warn

    <Directory "/srv/flyweb/updates">
        Require method GET HEAD
    </Directory>
    # Apache sirve Range (descargas reanudables) por defecto
    AddType application/x-apple-diskimage .dmg
    <FilesMatch "\.dmg$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Files "appcast.xml">
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>

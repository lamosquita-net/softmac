# PROPUESTA (NUBE, 03-10-2026), aún no en producción: vhost sync.flyweb.lamosquita.net, para añadir al fragmento de
# /etc/apache2/sites-enabled/lamosquita.conf (junto a flyweb-vhosts.conf) cuando el HUMANO lo valide.
#
# Qué hace: delante de flyweb-sync (FlyWeb/servidor/sync, systemd/flyweb-sync.service, solo en 127.0.0.1:8295).
#   POST /v2/command/  -> sincronización de FlyWeb (contraseñas, marcadores…). El navegador lo usa desde build.sh
#                         (brave_sync_endpoint). Lo demás: 404.
# Los datos llegan cifrados de extremo a extremo (la clave sale del código de 24 palabras del usuario y nunca sale
# de sus Macs): ni ns2 ni nosotros podemos leerlos. Solo lo contacta un FlyWeb en el que el usuario active
# Sincronizar.
#
# Privacidad, igual que updates., components. y proxy.: sin IP en accesos ni errores, y flyweb-sync tampoco la recibe
# (ProxyAddHeaders Off y se quitan las cabeceras con IP); registros en /var/log/flyweb/sync/, fuera de fail2ban y
# CrowdSec.
#
# Necesita: registro A sync.flyweb.lamosquita.net -> 51.91.19.170 (ns1-ns3); el nombre en el certificado
# (certbot --expand); módulos rewrite y proxy_http (ya activos para proxy.); /var/log/flyweb/sync/.

<VirtualHost *:80>
    ServerName sync.flyweb.lamosquita.net
    Redirect permanent / https://sync.flyweb.lamosquita.net/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName sync.flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/FlyWeb/proxy-vacio
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        LogFormat "%t \"%m %U\" %>s %b" sinip_sinconsulta
        ErrorLog /var/log/flyweb/sync/apache_error.log
        ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
        CustomLog /var/log/flyweb/sync/apache_access.log sinip_sinconsulta

        # flyweb-sync ya limita a 8 MB (y a 32 MB descomprimido, tras comprobar el token).
        LimitRequestBody 8388608
        ProxyRequests Off
        ProxyAddHeaders Off
        ProxyPreserveHost Off
        ProxyVia Off
        ProxyTimeout 70
        RequestHeader unset Cookie
        RequestHeader unset Referer
        RequestHeader unset X-Forwarded-For
        RequestHeader unset Forwarded
        RequestHeader unset X-Real-IP
        Header unset Set-Cookie

        # Destino (las pruebas lo cambian).
        <IfDefine !FLYWEB_SYNC_BACKEND>
            Define FLYWEB_SYNC_BACKEND http://127.0.0.1:8295
        </IfDefine>
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} =POST
        RewriteRule ^/v2/command/$ ${FLYWEB_SYNC_BACKEND}/v2/command/ [P,L]
        RewriteRule ^ - [R=404,L]
    </VirtualHost>
</IfModule>

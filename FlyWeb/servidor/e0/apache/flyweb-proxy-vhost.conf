# EN PRODUCCIÓN desde el 03-10-2026 (NUBE lo propuso; LOCAL lo instaló en ns2 con permiso del HUMANO): vhost
# proxy.flyweb.lamosquita.net, al final de /etc/apache2/sites-available/lamosquita.conf.
#
# Qué hace: FlyWeb manda aquí, en lugar de a los proxies de Brave (brave-core nube/proxies-propios, build.sh):
#   /v4/...                                  Safe Browsing          -> safebrowsing.googleapis.com
#   /safebrowsing/clientreport/download      comprobación de descargas -> sb-ssl.google.com
#   /safebrowsing/clientreport/crx-list-info lista de extensiones   -> safebrowsing.google.com
#   /edgedl/chrome/dict/<idioma>.bdic         diccionarios del corrector -> dl.google.com
# Todo lo demás: 404. Google ve la IP de ns2, nunca la del usuario.
#
# Privacidad, igual que updates. y components.: sin IP en accesos ni errores, sin X-Forwarded-For hacia Google,
# sin cookies ni Referer; registros en /var/log/flyweb/proxy/, fuera de fail2ban y CrowdSec.
#
# Clave de la API de Safe Browsing (proyecto de Google Cloud del HUMANO, API gratuita, uso no comercial; decisión del
# HUMANO 03-10: revisar si algún día hay comercialización, aunque sea indirecta): en
# /etc/apache2/flyweb-proxy-keys.conf (root 0600, FUERA del repo; modelo en flyweb-proxy-keys.conf.ejemplo). El proxy
# quita la clave que trae el navegador y pone la nuestra. Falla cerrado: sin fichero, Safe Browsing da 404 (los
# diccionarios siguen funcionando).
#
# Necesita: registro A proxy.flyweb.lamosquita.net -> 51.91.19.170 (ns1-ns3); el nombre en el certificado
# (certbot --expand); módulos rewrite y proxy_http (además de los de flyweb-vhosts.conf); /var/log/flyweb/proxy/.
# Riesgo asumido: cualquiera que conozca la URL puede gastar la cuota de la clave (el navegador no manda la clave de
# servicio a estos hosts). La cuota gratuita basta para pocos cientos de usuarios; si se agota, Safe Browsing deja de
# actualizarse (el navegador sigue funcionando). Vigilar en la consola de Google Cloud.

<VirtualHost *:80>
    ServerName proxy.flyweb.lamosquita.net
    Redirect permanent / https://proxy.flyweb.lamosquita.net/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName proxy.flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/FlyWeb/proxy-vacio
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        LogFormat "%t \"%m %U\" %>s %b" sinip_sinconsulta
        ErrorLog /var/log/flyweb/proxy/apache_error.log
        ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
        # Sin la consulta (%U, no %r): las de Safe Browsing llevan prefijos de hash de URL.
        CustomLog /var/log/flyweb/proxy/apache_access.log sinip_sinconsulta

        # Clave: ANTES de las reglas (Apache sustituye ${...} al leer, línea a línea).
        IncludeOptional /etc/apache2/flyweb-proxy-keys.conf
        # Destinos (las pruebas los cambian por servidores locales).
        <IfDefine !FLYWEB_PROXY_SB>
            Define FLYWEB_PROXY_SB      https://safebrowsing.googleapis.com
            Define FLYWEB_PROXY_SBSSL   https://sb-ssl.google.com
            Define FLYWEB_PROXY_SB2     https://safebrowsing.google.com
            Define FLYWEB_PROXY_DICT    https://dl.google.com
        </IfDefine>

        LimitRequestBody 1048576
        ProxyRequests Off
        ProxyAddHeaders Off
        ProxyPreserveHost Off
        ProxyVia Off
        SSLProxyEngine On
        SSLProxyVerify require
        # La cadena de Google tiene 2 certificados; por defecto Apache solo acepta 1 (error AH02040 y 500 en los
        # diccionarios). Probado en ns2 el 03-10.
        SSLProxyVerifyDepth 5
        SSLProxyCheckPeerName on
        SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
        RequestHeader unset Cookie
        RequestHeader unset Referer
        RequestHeader unset X-Client-Data
        # La IP que el cliente pudiera traer de un proxy suyo tampoco llega a Google.
        RequestHeader unset X-Forwarded-For
        RequestHeader unset Forwarded
        RequestHeader unset X-Real-IP
        Header unset Set-Cookie

        RewriteEngine On
        <IfDefine FLYWEB_SB_KEY>
            # Safe Browsing v4 (GET .../v4/<método>?$req=...&$ct=...&key=...). Se cambia la clave por la nuestra.
            RewriteCond %{REQUEST_METHOD} ^(GET|POST)$
            RewriteCond %{QUERY_STRING} ^(.*?)(?:^|&)key=[^&]*(&.*)?$
            RewriteRule ^/v4/([A-Za-z]+:[A-Za-z]+)$ ${FLYWEB_PROXY_SB}/v4/$1?%1%2&key=${FLYWEB_SB_KEY} [P,NE,L]
            RewriteCond %{REQUEST_METHOD} ^(GET|POST)$
            RewriteRule ^/v4/([A-Za-z]+:[A-Za-z]+)$ ${FLYWEB_PROXY_SB}/v4/$1?%{QUERY_STRING}&key=${FLYWEB_SB_KEY} [P,NE,L]
            # Comprobación de descargas y lista de extensiones (POST con protobuf, ?key=...).
            RewriteCond %{REQUEST_METHOD} =POST
            RewriteCond %{QUERY_STRING} ^(.*?)(?:^|&)key=[^&]*(&.*)?$
            RewriteRule ^/safebrowsing/clientreport/download$ ${FLYWEB_PROXY_SBSSL}/safebrowsing/clientreport/download?%1%2&key=${FLYWEB_SB_KEY} [P,NE,L]
            RewriteCond %{REQUEST_METHOD} =POST
            RewriteRule ^/safebrowsing/clientreport/download$ ${FLYWEB_PROXY_SBSSL}/safebrowsing/clientreport/download?%{QUERY_STRING}&key=${FLYWEB_SB_KEY} [P,NE,L]
            RewriteCond %{REQUEST_METHOD} =POST
            RewriteCond %{QUERY_STRING} ^(.*?)(?:^|&)key=[^&]*(&.*)?$
            RewriteRule ^/safebrowsing/clientreport/crx-list-info$ ${FLYWEB_PROXY_SB2}/safebrowsing/clientreport/crx-list-info?%1%2&key=${FLYWEB_SB_KEY} [P,NE,L]
            RewriteCond %{REQUEST_METHOD} =POST
            RewriteRule ^/safebrowsing/clientreport/crx-list-info$ ${FLYWEB_PROXY_SB2}/safebrowsing/clientreport/crx-list-info?%{QUERY_STRING}&key=${FLYWEB_SB_KEY} [P,NE,L]
        </IfDefine>
        # Diccionarios del corrector (p. ej. es-es-3-0.bdic). Sin consulta.
        RewriteCond %{REQUEST_METHOD} =GET
        RewriteRule ^/edgedl/chrome/dict/([a-z]{2,3}(?:-[a-z]{2,4})?-[0-9]+-[0-9]+\.bdic)$ ${FLYWEB_PROXY_DICT}/edgedl/chrome/dict/$1 [P,L]
        # Todo lo demás.
        RewriteRule ^ - [R=404,L]
    </VirtualHost>
</IfModule>

# Destino: /etc/apache2/sites-available/flyweb-http.conf
# Puerto 80 de los tres subdominios: solo el reto de Let's Encrypt (certbot certonly --webroot -w
# /srv/flyweb/acme) y redirección a https de todo lo demás. Módulos: rewrite, alias.
#
# REGISTRO CON IP Y DENTRO DE fail2ban/CrowdSec (decisión del HUMANO, 02-10): FlyWeb usa siempre
# https (URL fijadas en build.sh, más HSTS), así que nada legítimo de FlyWeb pasa por aquí. Lo que llegue
# al 80 es un bot u otro navegador: se registra con IP en /var/log/apache2/flyweb/ para que lo vean.
<VirtualHost *:80>
    ServerName flyweb.lamosquita.net
    ServerAlias updates.flyweb.lamosquita.net components.flyweb.lamosquita.net
    DocumentRoot "/srv/flyweb/vacio"
    CustomLog /var/log/apache2/flyweb/http_access.log combined
    ErrorLog  /var/log/apache2/flyweb/http_error.log

    Alias "/.well-known/acme-challenge/" "/srv/flyweb/acme/.well-known/acme-challenge/"
    <Directory "/srv/flyweb/acme/.well-known/acme-challenge">
        Require method GET HEAD
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

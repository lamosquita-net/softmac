# Vhosts de FlyWeb en ns2, tal como están en producción (02-10-2026). Son un FRAGMENTO de
# /etc/apache2/sites-enabled/lamosquita.conf, que el HUMANO comparte con sus otros sitios.
# Norma del HUMANO: todo dentro de cada <VirtualHost>, nada a nivel de servidor (no afecta a otros sitios).
#
# Privacidad:
# - Puerto 80: solo redirige; sin registros propios, van a los generales de /var/log/apache2/ (con IP,
#   igual que el resto de sitios). FlyWeb usa siempre https: lo que llega aquí no es FlyWeb.
# - flyweb.lamosquita.net (página): con IP (combined), decisión del HUMANO.
# - updates. y components. (los contacta el navegador solo): SIN IP, ni en accesos ni en errores, y en
#   /var/log/flyweb/, fuera de fail2ban y CrowdSec.
# Clave de servicio: /etc/apache2/flyweb-components-keys.conf (root 0600, FUERA del repo; modelo en
# flyweb-components-keys.conf.ejemplo). Falla cerrado: sin fichero o con otra clave, /extensions da 403.
# Módulos: ssl, headers, http2, proxy, proxy_http.

<VirtualHost *:80>
    ServerName flyweb.lamosquita.net
    Redirect permanent / https://flyweb.lamosquita.net/
</VirtualHost>
<VirtualHost *:80>
    ServerName components.flyweb.lamosquita.net
    Redirect permanent / https://components.flyweb.lamosquita.net/
</VirtualHost>
<VirtualHost *:80>
    ServerName updates.flyweb.lamosquita.net
    Redirect permanent / https://updates.flyweb.lamosquita.net/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/flyweb.lamosquita.net
        <Directory /var/www/flyweb.lamosquita.net>
            Options -Indexes
            AllowOverride None
            Require all granted
        </Directory>
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Content-Security-Policy "default-src 'self'"
        Header always set X-Content-Type-Options "nosniff"
        ErrorLog /var/log/flyweb/flyweb.lamosquita.net/apache_error.log
        CustomLog /var/log/flyweb/flyweb.lamosquita.net/apache_access.log combined
        # E2-02: FlyWeb enlaza a /descargas/ y /descargas/#novedades; sin índice daba 403.
        RedirectMatch 302 "^/descargas/$" "/"
        # E2-05: los navegadores preguntan siempre por HTML, CSS, JS, SVG y CSV (304 si no han cambiado), para que nunca
        # mezclen una página nueva con un CSS o un JS viejos. Las páginas además versionan sus recursos (web/versionar.py).
        <FilesMatch "\.(html|css|js|svg|csv|txt)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        # Apache sirve Range (descargas reanudables) por defecto
        AddType application/x-apple-diskimage .dmg
        <FilesMatch "\.dmg$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "appcast.xml">
            Header set Cache-Control "no-cache"
        </Files>
    </VirtualHost>

    <VirtualHost *:443>
        ServerName updates.flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/FlyWeb/updates
        <Directory /var/www/FlyWeb/updates>
            Options -Indexes
            AllowOverride None
            Require all denied
            # E2-06: updates. sirve solo los DMG de la raíz y stable/appcast.xml (lo que usa Sparkle); lo demás, 403.
            <FilesMatch "^FlyWeb-[0-9]+(\.[0-9]+)*\.dmg$">
                Require all granted
            </FilesMatch>
        </Directory>
        <Directory /var/www/FlyWeb/updates/stable>
            Require all denied
            <Files "appcast.xml">
                Require all granted
            </Files>
        </Directory>
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Content-Security-Policy "default-src 'self'"
        Header always set X-Content-Type-Options "nosniff"
        LogFormat "%t \"%r\" %>s %b" sinip
        ErrorLog /var/log/flyweb/updates/apache_error.log
        ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
        CustomLog /var/log/flyweb/updates/apache_access.log sinip
        # Apache sirve Range (descargas reanudables) por defecto
        AddType application/x-apple-diskimage .dmg
        <FilesMatch "\.dmg$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "appcast.xml">
            Header set Cache-Control "no-cache"
        </Files>
    </VirtualHost>

    <VirtualHost *:443>
        ServerName components.flyweb.lamosquita.net
        Protocols h2 http/1.1
        ServerAdmin admin@lamosquita.net
        DocumentRoot /var/www/FlyWeb/components
        <Directory /var/www/FlyWeb/components>
            Options -Indexes
            AllowOverride None
            Require all granted
        </Directory>
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile    /etc/letsencrypt/live/flyweb.lamosquita.net/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/flyweb.lamosquita.net/privkey.pem
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set Content-Security-Policy "default-src 'self'"
        Header always set X-Content-Type-Options "nosniff"
        LogFormat "%t \"%r\" %>s %b" sinip
        ErrorLog /var/log/flyweb/components/apache_error.log
        ErrorLogFormat "[%{cu}t] [%-m:%l] %F: %E: %M"
        # Sin IP también dentro de los mensajes: mod_proxy_http la escribe en el texto de sus errores (AH01095,
        # AH01097, AH02609) y ErrorLogFormat no la quita. Los fallos de conexión con el servicio (mod_proxy) siguen.
        LogLevel proxy_http:crit
        CustomLog /var/log/flyweb/components/apache_access.log sinip
        # Clave de servicio: ANTES del <Location> (Apache sustituye ${...} al leer, línea a línea)
        IncludeOptional /etc/apache2/flyweb-components-keys.conf
        LimitRequestBody 65536
        ProxyRequests Off
        # El servicio no recibe la IP del cliente (sin X-Forwarded-For)
        ProxyAddHeaders Off
        ProxyPreserveHost On
        ProxyPass        "/extensions" "http://127.0.0.1:8192/extensions"
        ProxyPassReverse "/extensions" "http://127.0.0.1:8192/extensions"
        <Location "/extensions">
            <RequireAll>
                Require method POST
                Require expr "%{HTTP:BraveServiceKey} =~ /^[0-9a-f]{64}$/ && (%{HTTP:BraveServiceKey} == '${FLYWEB_KEY_ACTUAL}' || %{HTTP:BraveServiceKey} == '${FLYWEB_KEY_ANTERIOR}')"
            </RequireAll>
        </Location>
        # Paquetes CRX en /var/www/FlyWeb/components/release/<id>/extension_<versión>.crx
        AddType application/x-chrome-extension .crx
    </VirtualHost>
</IfModule>

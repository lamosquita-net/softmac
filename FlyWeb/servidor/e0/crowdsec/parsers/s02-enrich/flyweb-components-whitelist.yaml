# Destino: /etc/crowdsec/parsers/s02-enrich/flyweb-components-whitelist.yaml
# Excluye de los escenarios SOLO el tráfico legítimo de los navegadores FlyWeb, y solo en el
# registro de components. (evt.Line.Src = fichero de origen). Todo lo demás de ese vhost
# (otras rutas, 4xx, sondeos) sigue contando y se banea igual que en el resto del servidor.
# Comprobar con `cscli explain` (README) que los campos Meta existen con el analizador instalado.
name: lamosquita/flyweb-components-whitelist
description: "FlyWeb: consultas del actualizador de componentes y descargas de CRX"
whitelist:
  reason: "FlyWeb component updater"
  expression:
    - evt.Line.Src == '/var/log/flyweb-components/access.log' && evt.Meta.http_verb == 'POST' && evt.Meta.http_path == '/extensions' && evt.Meta.http_status in ['200', '302', '307']
    - evt.Line.Src == '/var/log/flyweb-components/access.log' && evt.Meta.http_verb in ['GET', 'HEAD'] && evt.Meta.http_path startsWith '/release/' && evt.Meta.http_status in ['200', '206', '304']

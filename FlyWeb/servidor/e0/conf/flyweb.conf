# Destino: /etc/apache2/conf-available/flyweb.conf   (sudo a2enconf flyweb)
# Común a los tres vhost de FlyWeb. Apache no admite comentarios al final de una directiva.

# PRIVACIDAD: registro de accesos sin IP, sin User-Agent y sin Referer. Cada vhost añade además
# ErrorLogFormat sin [client IP]. Los registros van a /var/log/flyweb/, fuera de los patrones de
# fail2ban y CrowdSec de ns2 (/var/log/apache2/...).
LogFormat "%{%Y-%m-%dT%H:%M:%S}t \"%r\" %>s %b %D" flyweb_sinip

# CLAVE DE SERVICIO de components. (F2.6). El fichero, FUERA del repo, define FLYWEB_KEY_ACTUAL y
# FLYWEB_KEY_ANTERIOR. Modelo: ../apache/flyweb-components-keys.conf.ejemplo. root:root 0600.
# IncludeOptional: si falta, Apache sigue arrancando para el resto de sitios y /extensions queda
# cerrado (403), porque ninguna cabecera coincide con una variable sin definir.
IncludeOptional /etc/apache2/flyweb-components-keys.conf

# Ficheros de FlyWeb: dueño el usuario "flyweb"; Apache (www-data) solo lee. Sin enlaces simbólicos
# (lo más parecido a open_basedir para contenido estático), sin listados, sin .htaccess, sin CGI.
<Directory "/srv/flyweb">
    Options -Indexes -FollowSymLinks -ExecCGI -Includes
    AllowOverride None
    Require all denied
</Directory>
